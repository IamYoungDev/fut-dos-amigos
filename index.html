<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Soccer da Galera</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;cursor:pointer;outline:none}
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script>
"use strict";
// =====================================================================
// HEAD SOCCER DA GALERA
// =====================================================================

// ============================ CONFIG ==================================
const W = 480, H = 270, STEP = 1000 / 60;
const GROUND = 232;
const GOAL_W = 44, CROSS_Y = 130, CROSS_H = 5, BALL_R = 7;
const B_GRAV = 0.24, P_GRAV = 0.4, JUMP_V = -7.4, MOVE = 2.3, KICK = 7.8, KICK_FRAMES = 15, BALL_MAX = 13.5;
const MATCH_TIME = 90, WIN_GOALS = 5;
const POWER_RATE = 100 / (15 * 60), POWER_TOUCH = 4;
const D2R = Math.PI / 180;
const FONT = '"Press Start 2P", "Courier New", monospace';
const BARS = [
  { x: 0, y: CROSS_Y, w: GOAL_W + 4, h: CROSS_H },
  { x: W - GOAL_W - 4, y: CROSS_Y, w: GOAL_W + 4, h: CROSS_H },
];
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ============================ UTIL ====================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inRect = (p, r) => p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, f) { const [r, g, b] = hex2rgb(h); return f >= 0 ? rgb2hex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f) : rgb2hex(r * (1 + f), g * (1 + f), b * (1 + f)); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ------- desenho "pixelado" em qualquer contexto -------
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function D(c, cx, cy, r, col) {
  c.fillStyle = col; const ri = Math.floor(r);
  for (let y = -ri; y <= ri; y++) { const w = Math.round(Math.sqrt(Math.max(0, r * r - y * y))); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}
function E(c, cx, cy, rx, ry, col) {
  c.fillStyle = col; const ri = Math.floor(ry);
  for (let y = -ri; y <= ri; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry)))); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}
function P(c, pts, col) { c.fillStyle = col; c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fill(); }
function L(c, x0, y0, x1, y1, col, w = 1) {
  c.fillStyle = col; const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) c.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), w, w);
}
function txt(s, x, y, o = {}) {
  const c = o.c || ctx, size = o.size || 8;
  if (!o.font) s = String(s).replace(/[ÁÀÂÃ]/g, 'A').replace(/[ÉÊ]/g, 'E').replace(/Í/g, 'I').replace(/[ÓÔÕ]/g, 'O').replace(/Ú/g, 'U').replace(/Ç/g, 'C');
  c.font = (o.font ? o.font : size + 'px ' + FONT);
  c.textAlign = o.align || 'left'; c.textBaseline = 'top';
  x = Math.round(x); y = Math.round(y);
  if (o.outline !== false) {
    c.fillStyle = o.oc || '#000';
    const t = size >= 16 ? 2 : 1;
    for (const [dx, dy] of [[-t, 0], [t, 0], [0, -t], [0, t], [t, t]]) c.fillText(s, x + dx, y + dy);
  }
  c.fillStyle = o.color || '#fff'; c.fillText(s, x, y);
}
function wrap(s, maxW, size = 8) {
  ctx.font = size + 'px ' + FONT;
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function panel(x, y, w, h, bg = 'rgba(12,10,30,0.85)', border = '#ffffff') {
  R(ctx, x, y, w, h, bg); R(ctx, x, y, w, 1, border); R(ctx, x, y + h - 1, w, 1, border); R(ctx, x, y, 1, h, border); R(ctx, x + w - 1, y, 1, h, border);
}
function frameRect(c, x, y, w, h, col, t = 1) { R(c, x, y, w, t, col); R(c, x, y + h - t, w, t, col); R(c, x, y, t, h, col); R(c, x + w - t, y, t, h, col); }

// ============================ INPUT ===================================
const keys = {}, pressed = {};
const mouse = { x: -1, y: -1, click: false, moved: false };
const NOSCROLL = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1', 'Tab', 'Enter', 'Backspace'];
// alguns teclados/teclado numérico mandam e.code diferente: também usa o nome da tecla
const KEY_ALIAS = { ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', Left: 'ArrowLeft', Right: 'ArrowRight', Up: 'ArrowUp', Down: 'ArrowDown', Enter: 'Enter' };
function keyCodes(e) {
  const out = []; if (e.code) out.push(e.code);
  const a = KEY_ALIAS[e.key]; if (a && a !== e.code) out.push(a);
  if (!e.code && e.key && e.key.length === 1) out.push('Key' + e.key.toUpperCase());
  return out;
}
addEventListener('keydown', e => {
  const cs = keyCodes(e);
  if (cs.some(c => NOSCROLL.includes(c))) e.preventDefault();
  for (const c of cs) { if (!keys[c]) pressed[c] = true; keys[c] = true; }
  SFX.init();
});
addEventListener('keyup', e => { for (const c of keyCodes(e)) keys[c] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
cv.addEventListener('mousedown', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.click = true; SFX.init(); cv.focus(); });
cv.tabIndex = 0;
const wasPressed = (...codes) => codes.some(c => pressed[c]);
const CTRL = {
  p1: { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], kick: ['KeyS', 'Space'], power: ['KeyE', 'KeyQ'] },
  p2: { left: ['ArrowLeft', 'KeyJ', 'Numpad4'], right: ['ArrowRight', 'KeyL', 'Numpad6'], up: ['ArrowUp', 'KeyI', 'Numpad8'], kick: ['ArrowDown', 'KeyK', 'Numpad5', 'Numpad2'], power: ['Enter', 'KeyO', 'ShiftRight', 'Numpad0', 'NumpadEnter'] },
};
CTRL.solo = {}; for (const k in CTRL.p1) CTRL.solo[k] = CTRL.p1[k].concat(CTRL.p2[k]);

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize);

// ============================ AUDIO ===================================
const SFX = {
  ac: null, out: null, muted: false, nb: null, last: {},
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.ac = new A();
      this.out = this.ac.createGain(); this.out.gain.value = 0.3; this.out.connect(this.ac.destination);
      const len = this.ac.sampleRate; this.nb = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  ok() { if (!this.ac || this.muted) return false; if (this.ac.state === 'suspended') this.ac.resume(); return true; },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (o.delay || 0);
    const os = ac.createOscillator(), g = ac.createGain();
    os.type = o.type || 'square'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t + dur);
    const v = o.vol ?? 0.25;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.att || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lfo) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.lfo; lg.gain.value = o.lfoAmt || f * 0.1; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.05); }
    if (o.lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); fl.connect(g); } else os.connect(g);
    g.connect(this.out); os.start(t); os.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (o.delay || 0);
    const s = ac.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = o.ft || 'lowpass'; fl.frequency.setValueAtTime(o.f || 1200, t);
    if (o.fto) fl.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    fl.Q.value = o.q || 1;
    const g = ac.createGain(), v = o.vol ?? 0.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.att || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  drums(sec) {
    const s = 60 / 140 / 4, n = Math.floor(sec / s);
    for (let i = 0; i < n; i++) {
      const d = i * s;
      if (i % 8 === 0) this.tone(75, 0.25, { type: 'sine', to: 42, vol: 0.55, delay: d });
      if (i % 8 === 4) this.tone(95, 0.18, { type: 'sine', to: 60, vol: 0.4, delay: d });
      this.noise(0.04, { ft: 'highpass', f: 2600, vol: i % 2 ? 0.05 : 0.11, delay: d });
      if ([3, 6, 10, 13].includes(i % 16)) this.tone(420, 0.05, { vol: 0.08, delay: d });
      if (i % 8 === 0 || i % 8 === 3) this.tone(900, 0.07, { type: 'triangle', vol: 0.1, delay: d });
      if (i % 8 === 6) this.tone(1250, 0.07, { type: 'triangle', vol: 0.1, delay: d });
    }
  },
  play(n, throttle = 0) {
    if (throttle) { const now = performance.now(); if (this.last[n] && now - this.last[n] < throttle) return; this.last[n] = now; }
    if (NET.log && !this._in) NET.log.push(n);
    this._in = (this._in || 0) + 1;
    try { this._play(n); } finally { this._in--; }
  },
  _play(n) {
    switch (n) {
      case 'kick': this.tone(160, 0.09, { to: 55, vol: 0.35 }); this.noise(0.05, { f: 3000, ft: 'highpass', vol: 0.12 }); break;
      case 'head': this.tone(260, 0.06, { type: 'triangle', to: 180, vol: 0.3 }); break;
      case 'bounce': this.tone(140, 0.04, { type: 'sine', vol: 0.15 }); break;
      case 'post': this.tone(880, 0.25, { to: 600, vol: 0.12 }); this.tone(1320, 0.2, { type: 'triangle', vol: 0.1 }); break;
      case 'jump': this.tone(300, 0.08, { to: 520, vol: 0.06 }); break;
      case 'whistle': for (let i = 0; i < 8; i++) this.tone(i % 2 ? 2350 : 2150, 0.05, { type: 'sine', vol: 0.16, delay: i * 0.045 }); break;
      case 'whistleLong': for (let k = 0; k < 3; k++) for (let i = 0; i < 6; i++) this.tone(i % 2 ? 2350 : 2150, 0.05, { type: 'sine', vol: 0.16, delay: k * 0.45 + i * 0.045 }); break;
      case 'goal': this.noise(2.2, { ft: 'bandpass', f: 900, q: 0.6, vol: 0.35, att: 0.25 }); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, { delay: 0.1 + i * 0.1, vol: 0.14 })); this.play('whistle'); break;
      case 'power': [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.1, { delay: i * 0.05, vol: 0.12, type: 'triangle' })); break;
      case 'ready': this.tone(880, 0.06, { vol: 0.08 }); this.tone(1320, 0.08, { delay: 0.07, vol: 0.08 }); break;
      case 'move': this.tone(620, 0.03, { vol: 0.07 }); break;
      case 'select': this.tone(880, 0.05, { vol: 0.1 }); this.tone(1320, 0.07, { delay: 0.05, vol: 0.1 }); break;
      case 'back': this.tone(500, 0.06, { to: 300, vol: 0.1 }); break;
      case 'zombie': this.tone(95, 1.3, { type: 'sawtooth', lfo: 7, lfoAmt: 18, lp: 700, vol: 0.4, att: 0.1 }); this.tone(70, 1.1, { type: 'sawtooth', lfo: 5, lfoAmt: 10, lp: 400, vol: 0.3, att: 0.2, delay: 0.1 }); this.noise(1.0, { f: 500, vol: 0.12, att: 0.1 }); break;
      case 'drums': this.drums(3); break;
      case 'horn': [0, 0.22].forEach(d => { this.tone(415, 0.17, { delay: d, vol: 0.16 }); this.tone(523, 0.17, { delay: d, vol: 0.12 }); }); break;
      case 'car': this.noise(1.2, { f: 220, vol: 0.16 }); this.tone(70, 1.2, { type: 'sawtooth', lfo: 20, lfoAmt: 10, lp: 300, vol: 0.14 }); break;
      case 'pew': this.tone(900, 0.25, { type: 'sawtooth', to: 180, vol: 0.14 }); break;
      case 'hit': this.tone(120, 0.12, { to: 50, vol: 0.3 }); this.noise(0.1, { f: 2000, vol: 0.15 }); break;
      case 'tick': this.tone(1200, 0.02, { vol: 0.06 }); break;
      case 'jackpot': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => this.tone(f, 0.12, { delay: i * 0.06, vol: 0.12 })); this.noise(0.6, { ft: 'highpass', f: 6000, vol: 0.08, delay: 0.3 }); break;
      case 'lose': [392, 370, 349, 330].forEach((f, i) => this.tone(f, 0.3, { delay: i * 0.28, type: 'triangle', vol: 0.18, lfo: 6, lfoAmt: 8 })); break;
      case 'weird': { const f = rand(150, 700); this.tone(f, 0.45, { type: choice(['sawtooth', 'square', 'triangle']), to: f * rand(0.3, 2.5), lfo: rand(5, 25), lfoAmt: f * 0.15, vol: 0.18 }); break; }
      case 'slowmo': this.tone(700, 0.8, { type: 'sine', to: 80, vol: 0.2 }); break;
      case 'build': this.tone(110, 1.0, { type: 'sawtooth', to: 880, lp: 2000, vol: 0.14 }); this.noise(1.0, { f: 300, fto: 6000, vol: 0.1 }); break;
      case 'drop': this.tone(55, 0.9, { type: 'sine', to: 35, vol: 0.6 }); this.tone(110, 0.5, { to: 40, lp: 400, vol: 0.3 }); this.noise(0.4, { f: 800, vol: 0.3 }); break;
      case 'poof': this.noise(0.25, { ft: 'bandpass', f: 1500, fto: 300, vol: 0.2 }); break;
      case 'aura': [784, 880, 784, 880, 1175].forEach((f, i) => this.tone(f, 0.12, { delay: i * 0.08, type: 'triangle', vol: 0.12 })); this.noise(0.8, { ft: 'highpass', f: 5000, vol: 0.06 }); break;
      case 'invis': this.tone(1200, 0.4, { type: 'sine', to: 2400, vol: 0.1, lfo: 30, lfoAmt: 200 }); break;
      case 'scare': this.tone(1500, 0.1, { to: 2200, vol: 0.1 }); break;
      case 'super': this.noise(0.5, { f: 3000, fto: 400, vol: 0.2 }); this.tone(300, 0.3, { type: 'sawtooth', to: 900, vol: 0.12 }); break;
      case 'coin': this.tone(988, 0.06, { vol: 0.1 }); this.tone(1319, 0.15, { delay: 0.06, vol: 0.1 }); break;
      case 'ally': [330, 440, 554, 660].forEach((f, i) => this.tone(f, 0.1, { delay: i * 0.06, vol: 0.12 })); break;
      case 'dizzy': this.tone(900, 0.6, { type: 'triangle', to: 260, lfo: 12, lfoAmt: 60, vol: 0.14 }); break;
      case 'punch': this.tone(190, 0.1, { to: 60, vol: 0.32 }); this.noise(0.07, { f: 1400, vol: 0.2 }); break;
      case 'ding': this.tone(1568, 0.3, { type: 'triangle', vol: 0.14 }); this.tone(2093, 0.35, { type: 'triangle', vol: 0.1, delay: 0.06 }); break;
      case 'whoosh': this.noise(0.3, { ft: 'bandpass', f: 500, fto: 3200, q: 1.5, vol: 0.18 }); break;
      case 'champ': [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, { delay: i * 0.14, vol: 0.13, type: 'triangle' })); break;
    }
  },
};
function speak(text, lang = 'pt-BR', pitch = 1, rate = 1) {
  if (NET.slog) NET.slog.push([text, lang, pitch, rate]);
  if (SFX.muted || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.pitch = pitch; u.rate = rate; u.volume = 0.9; speechSynthesis.speak(u); } catch (e) { }
}

// ============================ SPRITES =================================
const OUT = '#1a1222';
class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.c = new Array(w * h).fill(null); this.t = new Array(w * h).fill(0); }
  set(x, y, col, tag = 0) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; const i = y * this.w + x; this.c[i] = col; this.t[i] = tag; }
  get(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; return this.c[y * this.w + x]; }
  tagAt(x, y) { if (x < 0 || y < 0 || x >= this.w || y >= this.h) return -1; return this.t[y * this.w + x]; }
  disc(cx, cy, r, col, tag = 0, f) {
    for (let y = Math.floor(cy - r - 1); y <= Math.ceil(cy + r + 1); y++)
      for (let x = Math.floor(cx - r - 1); x <= Math.ceil(cx + r + 1); x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy <= r * r + 0.6 * r && (!f || f(x, y))) this.set(x, y, col, tag);
      }
  }
  rect(x, y, w, h, col, tag = 0) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, col, tag); }
  line(x0, y0, x1, y1, col, tag = 0) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) this.set(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, col, tag); }
  each(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) fn(x, y, this.c[y * this.w + x], this.t[y * this.w + x]); }
  outline(col = null) {
    const add = [];
    this.each((x, y, c) => { if (c) return; const nb = this.get(x, y + 1) || this.get(x, y - 1) || this.get(x - 1, y) || this.get(x + 1, y); if (nb) add.push([x, y, nb]); });
    for (const [x, y, nb] of add) this.set(x, y, col || (nb.startsWith('#') ? mix(nb, '#140c1c', 0.74) : OUT), 9); return this;
  }
  fromMap(map, pal, ox = 0, oy = 0) { map.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) this.set(ox + x, oy + y, pal[ch]); })); return this; }
  canvas() {
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h; const g = c.getContext('2d');
    this.each((x, y, col) => { if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }); return c;
  }
}

// ---------- cabelos ----------
function capFill(C, cond) { const { p, hc } = C; for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) if (C.inF(x, y) && cond(x, y)) p.set(x, y, hc, 2); }

function circleRect(o, rc, e = 0.6) {
  const px = clamp(o.x, rc.x, rc.x + rc.w), py = clamp(o.y, rc.y, rc.y + rc.h);

  if (d >= o.r) return false;
  let nx, ny;
  if (d < 0.001) { nx = 0; ny = o.y < rc.y + rc.h / 2 ? -1 : 1; o.y = ny < 0 ? rc.y - o.r : rc.y + rc.h + o.r; }
  else { nx = dx / d; ny = dy / d; o.x = px + nx * o.r; o.y = py + ny * o.r; }
  const vn = o.vx * nx + o.vy * ny;
  if (vn < 0) { o.vx -= (1 + e) * vn * nx; o.vy -= (1 + e) * vn * ny; }
  return { nx, ny, vn };
}

}

// ============================ TORNEIO =================================
const TOUR_FORMATS = [
  { v: 0, l: 'MATA-MATA (4)', n: 4, gs: 0, adv: 0, d: 'Semifinal e final. 4 participantes.' },
  { v: 1, l: 'MATA-MATA (8)', n: 8, gs: 0, adv: 0, d: 'Quartas, semi e final. 8 participantes.' },
  { v: 2, l: '2 GRUPOS DE 4', n: 8, gs: 4, adv: 2, d: 'Todos contra todos no grupo. Os 2 melhores de cada vão pra semi. 8 participantes.' },
  { v: 3, l: '2 GRUPOS DE 5', n: 10, gs: 5, adv: 4, d: 'Todos contra todos no grupo. Os 4 melhores de cada vão pras quartas. Os 10 jogam.' },
];
const TS = { fmt: 2, draw: true, diff: 1, parts: null };
const koName = n => n === 2 ? 'FINAL' : n === 4 ? 'SEMIFINAL' : n === 8 ? 'QUARTAS' : 'MATA-MATA';

function roundRobin(ids) {
  const a = ids.slice(); if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const ms = [];
    for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) ms.push(r % 2 ? [y, x] : [x, y]); }
    rounds.push(ms); a.splice(1, 0, a.pop());
  }
  return rounds;
}
function newTournament(parts) {
  const f = TOUR_FORMATS[TS.fmt], seed = {}; for (const id in parts) seed[id] = Math.random();
  G.tour = { f, parts, ids: Object.keys(parts), rules: { ...G.rules }, diff: TS.diff, phase: 'setup', groups: null, fixtures: [], ko: null, champion: null, last: [], seed };
}
function tourSlots(T) { const f = T.f, s = []; if (f.gs) { for (let i = 0; i < f.gs; i++) for (let g = 0; g < 2; g++) s.push({ g, i }); } else for (let i = 0; i < f.n; i++) s.push({ i }); return s; }
function slotRect(T, k) {
  const sl = tourSlots(T)[k];
  if (T.f.gs) return { x: 230 + sl.g * 124, y: 42 + sl.i * 30, w: 118, h: 24 };
  const j = k >> 1, pos = k % 2;
  if (T.f.n === 4) return { x: 230 + j * 124, y: 70 + pos * 34, w: 118, h: 24 };
  return { x: 230 + (j % 2) * 124, y: 42 + Math.floor(j / 2) * 86 + pos * 32, w: 118, h: 24 };
}
function drawSlotFrame(T, k, id, hl) {
  const r = slotRect(T, k);
  R(ctx, r.x + 2, r.y + 2, r.w, r.h, 'rgba(0,0,0,0.4)'); R(ctx, r.x, r.y, r.w, r.h, id ? '#241d48' : 'rgba(20,16,44,0.8)');
  frameRect(ctx, r.x, r.y, r.w, r.h, hl ? (frame % 20 < 12 ? '#ffd23a' : '#7a6420') : '#3a3270');
  if (id) { const ch = CHAR_BY_ID[id]; ctx.save(); ctx.beginPath(); ctx.rect(r.x + 1, r.y + 1, 26, r.h - 2); ctx.clip(); drawHead(ctx, getHead(id), r.x + 14, r.y + 13, 1, 0.8); ctx.restore(); txt(ch.short, r.x + 30, r.y + 8, { color: ch.color }); if (T.parts[id] === 'human') R(ctx, r.x + r.w - 7, r.y + 3, 4, 4, '#ffd23a'); }
  else txt('?', r.x + r.w / 2, r.y + 8, { align: 'center', color: '#555a80' });
}
function drawSlotHeaders(T) {
  if (T.f.gs) { ['GRUPO A', 'GRUPO B'].forEach((s, g) => txt(s, 230 + g * 124 + 59, 28, { align: 'center', color: '#ffd23a' })); return; }
  for (let j = 0; j < T.f.n / 2; j++) { const r = slotRect(T, j * 2); txt('JOGO ' + (j + 1), r.x + r.w / 2, r.y - 11, { align: 'center', color: '#ffd23a' }); txt('x', r.x + r.w / 2, r.y + 25, { align: 'center', color: '#9aa0c0' }); }
}
function tourStart(T, placed) {
  const slots = tourSlots(T);
  if (T.f.gs) {
    T.groups = [[], []]; slots.forEach((sl, k) => { T.groups[sl.g][sl.i] = placed[k]; });
    const rr = [roundRobin(T.groups[0]), roundRobin(T.groups[1])]; T.fixtures = [];
    for (let r = 0; r < rr[0].length; r++) for (let g = 0; g < 2; g++) for (const [a, b] of rr[g][r]) T.fixtures.push({ a, b, g, rd: r + 1, score: null });
    T.phase = 'groups';
  } else { T.ko = { rounds: [placed.slice()], scores: [[]] }; T.phase = 'ko'; }
}
function standings(T, g) {
  const rows = T.groups[g].map(id => ({ id, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, pts: 0 })), by = {};
  rows.forEach(r => { by[r.id] = r; });
  for (const f of T.fixtures) if (f.g === g && f.score) {
    const A = by[f.a], B = by[f.b], [x, y] = f.score;
    A.j++; B.j++; A.gp += x; A.gc += y; B.gp += y; B.gc += x;
    if (x > y) { A.v++; B.d++; A.pts += 3; } else if (x < y) { B.v++; A.d++; B.pts += 3; } else { A.e++; B.e++; A.pts++; B.pts++; }
  }
  return rows.sort((p, q) => q.pts - p.pts || (q.gp - q.gc) - (p.gp - p.gc) || q.gp - p.gp || T.seed[p.id] - T.seed[q.id]);
}
function nextMatch(T) {
  if (T.phase === 'groups') { const f = T.fixtures.find(x => !x.score); return f ? { kind: 'g', f, a: f.a, b: f.b, label: `GRUPO ${'AB'[f.g]} · RODADA ${f.rd}` } : null; }
  if (T.phase === 'ko') {
    const r = T.ko.rounds.length - 1, l = T.ko.rounds[r], sr = T.ko.scores[r];
    for (let i = 0; i < l.length / 2; i++) if (!sr[i]) return { kind: 'ko', r, i, a: l[2 * i], b: l[2 * i + 1], label: koName(l.length) + (l.length > 2 ? ` · JOGO ${i + 1}` : '') };
  }
  return null;
}
function tourToKO(T) {
  const A = standings(T, 0).map(r => r.id), B = standings(T, 1).map(r => r.id);
  const slots = T.f.adv === 4 ? [A[0], B[3], A[1], B[2], B[0], A[3], B[1], A[2]] : [A[0], B[1], B[0], A[1]];
  T.ko = { rounds: [slots], scores: [[]] }; T.phase = 'ko';
}
function recordResult(T, nm, sc) {
  T.last.unshift(`${CHAR_BY_ID[nm.a].short} ${sc[0]} x ${sc[1]} ${CHAR_BY_ID[nm.b].short}`); if (T.last.length > 6) T.last.length = 6;
  if (nm.kind === 'g') { nm.f.score = sc.slice(); if (T.fixtures.every(f => f.score)) tourToKO(T); return; }
  const sr = T.ko.scores[nm.r]; sr[nm.i] = sc.slice();
  const list = T.ko.rounds[nm.r], np = list.length / 2;
  if (sr.filter(Boolean).length === np) {
    const w = []; for (let i = 0; i < np; i++) w.push(sr[i][0] > sr[i][1] ? list[2 * i] : list[2 * i + 1]);
    if (w.length === 1) { T.champion = w[0]; T.vice = w[0] === list[0] ? list[1] : list[0]; T.phase = 'done'; }
    else { T.ko.rounds.push(w); T.ko.scores.push([]); }
  }
}
function tourSim(T, nm) { recordResult(T, nm, simScore(nm.kind === 'g', T.rules)); }
function aliveHumans(T) {
  if (T.phase === 'groups') return T.ids.some(id => T.parts[id] === 'human');
  if (T.phase !== 'ko') return false;
  const r = T.ko.rounds.length - 1, l = T.ko.rounds[r], sr = T.ko.scores[r];
  return l.some((id, k) => { if (T.parts[id] !== 'human') return false; const s = sr[k >> 1]; if (!s) return true; return (k % 2 === 0) ? s[0] > s[1] : s[1] > s[0]; });
}
function tourPlayMatch(nm, watch) {
  const T = G.tour, ha = T.parts[nm.a] === 'human', hb = T.parts[nm.b] === 'human';
  let ctrl1, ctrl2;
  if (ha && hb) { ctrl1 = new HumanCtrl(CTRL.p1); ctrl2 = new HumanCtrl(CTRL.p2); }
  else if (ha) { ctrl1 = new HumanCtrl(CTRL.solo); ctrl2 = new AICtrl(T.diff); }
  else if (hb) { ctrl1 = new AICtrl(T.diff); ctrl2 = new HumanCtrl(CTRL.solo); }
  else { ctrl1 = new AICtrl(T.diff); ctrl2 = new AICtrl(T.diff); }
  const home = nm.kind === 'g' ? nm.a : choice([nm.a, nm.b]);
  G.stadium = CHAR_BY_ID[home].home;
  setScene(new VsScene({
    c1: nm.a, c2: nm.b, stadium: G.stadium, ctrl1, ctrl2, time: T.rules.time, goals: T.rules.goals, powers: T.rules.powers,
    allowDraw: nm.kind === 'g', tour: true, watch: !!watch, label: nm.label,

  }));

class TourPartsScene {
  constructor() {
    this.f = TOUR_FORMATS[TS.fmt]; this.st = {}; this.t = 0; this.msg = ''; this.msgT = 0; this.cur = 0;
    const prev = TS.parts || {};
    for (const c of CHARS) this.st[c.id] = prev[c.id] || 'off';
    if (this.f.n === 10) for (const c of CHARS) if (this.st[c.id] === 'off') this.st[c.id] = 'cpu';
    if (!CHARS.some(c => this.st[c.id] !== 'off')) this.st[G.c1] = 'human';
    for (let i = CHARS.length - 1; i >= 0 && this.count() > this.f.n; i--) if (this.st[CHARS[i].id] === 'cpu') this.st[CHARS[i].id] = 'off';
    for (let i = CHARS.length - 1; i >= 0 && this.count() > this.f.n; i--) this.st[CHARS[i].id] = 'off';
  }
  count() { return CHARS.filter(c => this.st[c.id] !== 'off').length; }
  cell(i) { return { x: 30 + (i % 5) * 84, y: 30 + Math.floor(i / 5) * 72, w: 80, h: 66 }; }
  btn(i) { return { x: W / 2 - 160 + i * 168, y: 182, w: 152, h: 18 }; }
  say(s) { this.msg = s; this.msgT = 120; SFX.play('back'); }
  cycle(id) {
    const s = this.st[id];
    if (s === 'off' && this.count() >= this.f.n) { this.say('JÁ TEM ' + this.f.n + '! TIRE ALGUÉM ANTES.'); return; }
    this.st[id] = s === 'off' ? 'cpu' : s === 'cpu' ? 'human' : 'off'; SFX.play('move');
  }
  fill() { const off = shuffle(CHARS.filter(c => this.st[c.id] === 'off').map(c => c.id)); while (this.count() < this.f.n && off.length) this.st[off.pop()] = 'cpu'; SFX.play('select'); }
  go() {
    if (this.count() !== this.f.n) { this.say('ESCOLHA EXATAMENTE ' + this.f.n + ' (TEM ' + this.count() + ').'); return; }
    TS.parts = { ...this.st }; const parts = {}; for (const c of CHARS) if (this.st[c.id] !== 'off') parts[c.id] = this.st[c.id];
    newTournament(parts); SFX.play('select'); setScene(TS.draw ? new TourDrawScene() : new TourManualScene());

// ============================ ONLINE (P2P / PeerJS) ===================
// O host roda a partida inteira; o convidado manda os controles e recebe "fotos" do jogo.
const NET = { peer: null, conn: null, role: null, code: '', myPick: null, oppPick: null, snap: null, sfxQ: [], spQ: [], log: null, slog: null, remote: null, cfg: null, series: null, myRematch: false, oppRematch: false };
const CODE_CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => { let s = ''; for (let i = 0; i < 5; i++) s += CODE_CH[Math.floor(Math.random() * CODE_CH.length)]; return s; };
const PEER_PREFIX = 'hsgalera-';

function netReset() {
  const peer = NET.peer, conn = NET.conn;
  NET.peer = null; NET.conn = null; NET.role = null; NET.code = ''; NET.myPick = null; NET.oppPick = null;
  NET.snap = null; NET.sfxQ = []; NET.spQ = []; NET.log = null; NET.slog = null; NET.remote = null; NET.cfg = null; NET.series = null; NET.myRematch = false; NET.oppRematch = false;
  setTimeout(() => { try { conn && conn.close(); } catch (e) { } try { peer && peer.destroy(); } catch (e) { } }, 250);
}
function netSend(o) { try { if (NET.conn && NET.conn.open) NET.conn.send(o); } catch (e) { } }
function netErrText(e) {
  const t = e && e.type;
  if (t === 'peer-unavailable') return 'SALA NÃO ENCONTRADA';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'SEM CONEXÃO COM O SERVIDOR';
  if (t === 'browser-incompatible') return 'NAVEGADOR SEM SUPORTE';
  return 'ERRO: ' + (t || 'DESCONHECIDO');
}
function netBind(conn) {
  NET.conn = conn;
  conn.on('data', d => { if (conn === NET.conn) netHandle(d); });
  conn.on('close', () => { if (conn === NET.conn) netLost(); });
  conn.on('error', () => { if (conn === NET.conn) netLost(); });
}
function netLost() {
  if (scene && scene.online) { netReset(); setScene(new MsgScene('O AMIGO SAIU DA SALA')); }
}
function netLeave() { netSend({ t: 'bye' }); netReset(); setScene(new TitleScene()); }

function netCreateHost(onCode, onErr, onConn) {
  if (typeof Peer === 'undefined') { onErr('SEM CONEXÃO COM O SERVIDOR'); return; }
  let tries = 0;
  const attempt = () => {
    const code = genCode();
    let peer;
    try { peer = new Peer(PEER_PREFIX + code, { debug: 0 }); } catch (e) { onErr('NAVEGADOR SEM SUPORTE'); return; }
    NET.peer = peer;
    peer.on('open', () => { if (peer === NET.peer) { NET.code = code; onCode(code); } });
    peer.on('connection', conn => {
      if (peer !== NET.peer) return;
      conn.on('open', () => {
        if (peer !== NET.peer || NET.conn) { try { conn.close(); } catch (e) { } return; }
        NET.role = 'host'; netBind(conn); onConn();
      });
    });
    peer.on('disconnected', () => { if (peer === NET.peer && !NET.conn) { try { peer.reconnect(); } catch (e) { } } });
    peer.on('error', e => {
      if (peer !== NET.peer) return;
      if (e && e.type === 'unavailable-id' && tries++ < 5) { try { peer.destroy(); } catch (_) { } attempt(); return; }
      onErr(netErrText(e));
    });
  };
  attempt();
}
function netJoin(code, onErr) {
  if (typeof Peer === 'undefined') { onErr('SEM CONEXÃO COM O SERVIDOR'); return; }
  let peer, done = false;
  const fail = m => { if (done) return; done = true; clearTimeout(to); onErr(m); };
  const to = setTimeout(() => { if (!NET.conn) fail('TEMPO ESGOTADO'); }, 15000);
  try { peer = new Peer({ debug: 0 }); } catch (e) { fail('NAVEGADOR SEM SUPORTE'); return; }
  NET.peer = peer;
  peer.on('open', () => {
    if (peer !== NET.peer) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    conn.on('open', () => {
      if (done || peer !== NET.peer) { try { conn.close(); } catch (e) { } return; }
      done = true; clearTimeout(to);
      NET.role = 'guest'; netBind(conn); G.mode = 'online'; setScene(new SelectScene());
    });
    conn.on('error', () => fail('FALHA AO CONECTAR'));
  });
  peer.on('error', e => { if (peer === NET.peer) fail(netErrText(e)); });
}

function netHandle(d) {
  if (!d || !d.t) return;
  switch (d.t) {
    case 'pick': NET.oppPick = d.id; netAdvance(); break;
    case 'cfg': if (NET.role === 'guest') NET.cfg = { mode: d.mode === 'tour' ? 'tour' : 'casual', time: d.time, goals: d.goals, powers: d.powers !== false }; break;
    case 'rematch': NET.oppRematch = true; netRematchCheck(); break;
    case 'start': if (NET.role === 'guest') startGuest(d); break;
    case 'snap':
      NET.snap = d;
      if (d.sfx && d.sfx.length) { NET.sfxQ.push(...d.sfx); if (NET.sfxQ.length > 24) NET.sfxQ.splice(0, NET.sfxQ.length - 24); }
      if (d.sp && d.sp.length) { NET.spQ.push(...d.sp); if (NET.spQ.length > 3) NET.spQ.splice(0, NET.spQ.length - 3); }
      break;
    case 'inp': if (NET.remote) NET.remote.set(d); break;
    case 'end': if (NET.role === 'guest') { NET.series = d.series || null; setScene(new ResultScene(d.res, false, true)); } break;
    case 'bye': netLost(); break;
  }
}
// revanche na mesma sala: quando os dois pedem, voltam pra escolha de jogador (o host escolhe o estádio depois)
function netRematchCheck() {
  if (!NET.myRematch || !NET.oppRematch || !(scene instanceof ResultScene) || !scene.net) return;
  NET.myRematch = false; NET.oppRematch = false; NET.myPick = null; NET.oppPick = null; NET.snap = null;
  NET.series = NET.role === 'host' && NET.cfg && NET.cfg.mode === 'tour' ? { w: [0, 0], n: 0, need: 2 } : null;
  G.mode = 'online'; SFX.play('select'); setScene(new SelectScene());
}
// os dois já escolheram o jogador: o host escolhe o estádio, o convidado espera
function netAdvance() {
  if (!NET.myPick || !NET.oppPick || !(scene instanceof SelectScene)) return;
  if (NET.role === 'host') { G.c1 = NET.myPick; G.c2 = NET.oppPick; setScene(new StadiumScene()); }
  else setScene(new NetWaitScene('O HOST ESTÁ ESCOLHENDO O ESTÁDIO'));
}
function netStartHost() {
  const r = G.online; let time = r.time, goals = r.goals; if (!time && !goals) goals = 5;
  const remote = new RemoteCtrl(); NET.remote = remote; NET.log = []; NET.slog = []; NET.snap = null;
  const cfg = {
    c1: NET.myPick, c2: NET.oppPick, stadium: G.stadium, ctrl1: new HumanCtrl(CTRL.solo), ctrl2: remote,
    time, goals, powers: r.powers, allowDraw: false, net: 'host',
    onEnd: res => {
      const S = NET.series; // torneio: melhor de 3
      if (S) { S.n++; if (res.winner === 0 || res.winner === 1) S.w[res.winner]++; }
      netSend({ t: 'end', res, series: S || null }); setScene(new ResultScene(res, false, true));
    },
  };
  netSend({ t: 'start', c1: cfg.c1, c2: cfg.c2, stadium: cfg.stadium, time, goals, powers: r.powers });
  setScene(new Match(cfg));
}
function startGuest(d) {
  G.stadium = d.stadium; NET.snap = null; NET.sfxQ = []; NET.spQ = [];
  setScene(new NetMatch({ c1: d.c1, c2: d.c2, stadium: d.stadium, ctrl1: null, ctrl2: null, time: d.time, goals: d.goals, powers: d.powers, allowDraw: false, net: 'guest', onEnd: () => { } }));
}
class RemoteCtrl {
  constructor() { this.i = { left: false, right: false, up: false, kick: false }; this.pw = false; }
  set(d) { this.i = { left: !!d.l, right: !!d.r, up: !!d.u, kick: !!d.k }; if (d.p) this.pw = true; }
  get() { const o = { left: this.i.left, right: this.i.right, up: this.i.up, kick: this.i.kick, power: this.pw }; this.pw = false; return o; }
}

// foto do estado do jogo (host -> convidado)
function netSendSnap(m) {
  if (!NET.conn || !NET.conn.open) return;
  const r1 = v => Math.round(v * 10) / 10;
  const pl = p => ({ sd: p.side, x: r1(p.x), y: r1(p.y), vx: r1(p.vx), vy: r1(p.vy), kx: r1(p.kx), f: p.facing, kt: r1(p.kickT), ka: p.kickAir ? 1 : 0, og: p.onGround ? 1 : 0, wh: p.wheelie, pw: r1(p.power), hu: r1(p.hurt), fx: p.fx, lf: p.life });
  const bl = b => ({ x: r1(b.x), y: r1(b.y), vx: r1(b.vx), vy: r1(b.vy), rot: Math.round(b.rot * 100) / 100, fire: b.fire, ghost: b.ghost, life: b.life });
  const fx = [];
  for (const e of m.fxs) {
    const d = {};
    for (const k of Object.keys(e)) {
      const v = e[k];
      if (v instanceof Player) { const i = m.players.indexOf(v); if (i >= 0) d[k] = { __p: i }; }
      else if (v === null || typeof v !== 'object') d[k] = v;
    }
    fx.push({ c: e.constructor.name, d });
  }
  const msg = {
    t: 'snap', sc: m.score, tm: m.time, go: m.golden ? 1 : 0, st: m.state, stT: m.stT, k: m.kicked ? 1 : 0, ov: m.over ? 1 : 0, sh: m.shake, pa: m.party, ti: m.tilt,
    pl: m.players.map(pl), al: m.allies.map(pl), b: bl(m.ball), fk: m.fakes.map(bl),
    pt: m.parts.slice(-80).map(q => [Math.round(q.x), Math.round(q.y), q.life, q.max, q.col, q.s || 1, q.note ? 1 : 0]),
    tx: m.texts, bn: m.banners, fx, sfx: NET.log ? NET.log.splice(0) : [], sp: NET.slog ? NET.slog.splice(0) : [],
  };
  try { NET.conn.send(msg); } catch (e) { }
}
const FXC = { Patada, Car, Aura67, Roulette, Drums, BassDrop, Ring, Pow };
function applyP(p, q) {
  p.x = q.x; p.y = q.y; p.vx = q.vx; p.vy = q.vy; p.kx = q.kx; p.facing = q.f; p.kickT = q.kt; p.kickAir = !!q.ka;
  p.onGround = !!q.og; p.wheelie = q.wh; p.power = q.pw; p.hurt = q.hu; p.fx = q.fx || {}; p.life = q.lf || 0;
}
function applyBall(b, q) { b.x = q.x; b.y = q.y; b.vx = q.vx; b.vy = q.vy; b.rot = q.rot; b.fire = q.fire; b.ghost = q.ghost; b.life = q.life; }

// partida vista pelo convidado: só desenha o que o host mandou
class NetMatch extends Match {
  constructor(cfg) {
    super(cfg);
    this.ctrl = new HumanCtrl(CTRL.solo); this.players[1].ctrl = this.ctrl; this.lastInp = ''; this.sendT = 0;
  }
  update() {
    this.t++;
    if (wasPressed('Escape', 'KeyP')) { this.paused = !this.paused; this.pauseMenu.i = 0; SFX.play('back'); }
    else if (this.paused) this.pauseMenu.update();
    const inp = this.paused ? {} : this.ctrl.get();
    const s = (inp.left ? 'l' : '') + (inp.right ? 'r' : '') + (inp.up ? 'u' : '') + (inp.kick ? 'k' : '') + (inp.power ? 'p' : '');
    if (s !== this.lastInp || ++this.sendT >= 10) { this.sendT = 0; this.lastInp = s; netSend({ t: 'inp', l: inp.left ? 1 : 0, r: inp.right ? 1 : 0, u: inp.up ? 1 : 0, k: inp.kick ? 1 : 0, p: inp.power ? 1 : 0 }); }
    for (const n of NET.sfxQ.splice(0)) SFX.play(n);
    for (const a of NET.spQ.splice(0)) speak(a[0], a[1], a[2], a[3]);
    const sn = NET.snap; if (sn) { NET.snap = null; this.apply(sn); }
  }
  apply(s) {
    this.score = s.sc; this.time = s.tm; this.golden = !!s.go; this.state = s.st; this.stT = s.stT; this.kicked = !!s.k; this.over = !!s.ov;
    this.shake = s.sh; this.party = s.pa; this.tilt = s.ti || null;
    this.players.forEach((p, i) => applyP(p, s.pl[i]));
    this.allies = s.al.map(q => { const a = new Player(FELIPE2, q.sd, this, null); a.isAlly = true; applyP(a, q); return a; });
    applyBall(this.ball, s.b);
    this.fakes = s.fk.map(q => { const b = new Ball(true); applyBall(b, q); return b; });
    this.parts = s.pt.map(a => ({ x: a[0], y: a[1], life: a[2], max: a[3], col: a[4], s: a[5], note: !!a[6] }));
    this.texts = s.tx; this.banners = s.bn;
    this.fxs = s.fx.map(f => this.mkFx(f)).filter(Boolean);
  }
  mkFx(f) {
    const C = FXC[f.c]; if (!C) return null;
    const o = Object.create(C.prototype);
    for (const k in f.d) { const v = f.d[k]; o[k] = (v && typeof v === 'object' && v.__p !== undefined) ? this.players[v.__p] : v; }
    return o;
  }
}

    dimBg(G.stadium, 0.7); title('SALA ONLINE', 12);
    txt(this.msg + '.'.repeat(1 + Math.floor(this.t / 20) % 3), W / 2, 120, { align: 'center', color: '#cfd8ff' });
    if (NET.cfg) { txt('REGRAS DA SALA', W / 2, 160, { align: 'center', color: '#ffd23a' }); netCfgLines(NET.cfg).forEach((l, i) => txt(l, W / 2, 176 + i * 12, { align: 'center', color: '#e8e8f0' })); }
    txt('ESC: SAIR DA SALA', W / 2, 246, { align: 'center', color: '#9aa0c0' });
  }
}
class MsgScene {
  constructor(msg) { this.msg = msg; this.menu = new Menu([{ label: 'OK', action: () => setScene(new TitleScene()) }], { y: 150, w: 120 }); }
  update() { if (wasPressed('Escape')) { setScene(new TitleScene()); return; } this.menu.update(); }
  render() { bgPattern(); txt(this.msg, W / 2, 100, { align: 'center', color: '#ffd23a' }); this.menu.draw(); }
}

// ============================ BOOT ====================================
let scene = null, frame = 0, fadeT = 0;
function setScene(s) { if (scene && scene.exit) scene.exit(); scene = s; fadeT = 10; if (s.enter) s.enter(); }
let last = performance.now(), acc = 0;
function loop(now) {
  let dt = now - last; last = now; if (dt > 100) dt = 100; acc += dt;
  while (acc >= STEP) {
    if (wasPressed('KeyM') && !(scene && scene.typing)) { SFX.muted = !SFX.muted; if (SFX.muted && window.speechSynthesis) speechSynthesis.cancel(); }
    if (scene) scene.update();
    frame++; if (fadeT > 0) fadeT--;
    for (const k in pressed) delete pressed[k];
    mouse.click = false; mouse.moved = false;
    acc -= STEP;
  }
  if (scene) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
    scene.render();
    if (fadeT > 0) { ctx.globalAlpha = fadeT / 10; R(ctx, 0, 0, W, H, '#05030f'); ctx.globalAlpha = 1; }
    if (SFX.muted) txt('SOM OFF (M)', W - 4, H - 10, { align: 'right', color: '#f88' });
  }
  requestAnimationFrame(loop);
}
function boot() {
  resize(); try { cv.focus(); } catch (e) { }
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').then(() => { for (const k in BG_CACHE) delete BG_CACHE[k]; }).catch(() => { });
  setScene(new TitleScene());
  requestAnimationFrame(loop);
}
boot();
